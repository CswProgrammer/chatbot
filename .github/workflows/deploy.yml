name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 20m
          envs: AUTH_SECRET,DEEPSEEK_API_KEY,POSTGRES_URL,AUTH_URL
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH=main
            if [ ! -d /var/www/chatbot/.git ]; then
              git clone https://github.com/CswProgrammer/chatbot.git /var/www/chatbot
            fi
            git -C /var/www/chatbot fetch origin main
            git -C /var/www/chatbot reset --hard origin/main
            bash /var/www/chatbot/scripts/deploy.sh
